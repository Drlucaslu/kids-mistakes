olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  cuotiben: 1

metadata:
  name: cuotiben
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  description: 家庭错题本：tutor 录错题，间隔复习到掌握，任务跟踪与周报
  title: 错题本
  version: '0.1.8'
  categories:
  - Productivity_v112

entrances:
- name: cuotiben
  host: cuotiben-svc
  port: 8080
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  title: 错题本
  # Public so tutors can open it on their phones; every page requires the app's own PIN sign-in
  # (the Olares owner is signed in automatically as the parent).
  authLevel: public
  openMethod: window

spec:
  versionName: '0.1.8'
  fullDescription: |
    家庭错题本。老师拍照录入孩子做错的题（AI 识别题目、建议知识点和错因），系统按 1/3/7/14/30 天安排复测，
    连对 3 次算掌握；AI 可出变式题（老师审核后进入复习）。老师布置任务、孩子打勾、老师确认；家长看周报。
    数据（SQLite + 照片）保存在本机应用数据目录，每天自动备份。
  upgradeDescription: |
    0.1.0 — 首个版本。
  developer: Lucas Lu
  website: https://www.olares.com
  submitter: Lucas Lu
  locale:
  - zh-CN
  - en-US
  supportArch:
  - amd64
  accelerator:
  - mode: cpu
    requiredCpu: 100m
    limitedCpu: '1'
    requiredMemory: 256Mi
    limitedMemory: 1Gi
    requiredDisk: 100Mi
    limitedDisk: 20Gi

permission:
  appData: true
  appCache: true

options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system

envs:
- envName: INIT_PARENT_PIN
  type: password
  required: true
  editable: true
  applyOnChange: true
  description: 首次启动时创建"家长"账号用的 PIN（至少 6 位数字）。之后在应用"设置"里改。
- envName: ANTHROPIC_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: Claude API Key，用于拍照识题和出变式题。留空则 AI 功能关闭，其余照常。
- envName: MODEL_PROVIDER
  type: string
  required: false
  default: anthropic
  editable: true
  applyOnChange: true
  options:
  - title: Anthropic Claude
    value: anthropic
  - title: OpenAI-compatible endpoint (local VLM)
    value: openai_compatible
  - title: Demo (fake answers)
    value: mock
  description: AI 服务商（应用"设置"里也可以切换）。
- envName: MODEL_NAME
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: 模型名，留空用默认（claude-opus-5-5）。
- envName: MODEL_BASE_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  description: OpenAI 兼容接口的 Base URL（以 /v1 结尾）。
- envName: MODEL_API_KEY
  type: password
  required: false
  editable: true
  applyOnChange: true
  description: OpenAI 兼容接口的 API Key（本地模型可留空）。
