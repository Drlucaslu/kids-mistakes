{{- $env := .Values.olaresEnv | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cuotiben
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  INIT_PARENT_PIN: {{ $env.INIT_PARENT_PIN | default "" | toString | quote }}
  ANTHROPIC_API_KEY: {{ $env.ANTHROPIC_API_KEY | default "" | toString | quote }}
  MODEL_API_KEY: {{ $env.MODEL_API_KEY | default "" | toString | quote }}
